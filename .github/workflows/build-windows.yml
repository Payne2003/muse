name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "muse/**"
      - "packaging/**"
      - "run_app.py"
      - "requirements*.txt"
      - "CHANGELOG.md"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Đẩy code lên các nhánh này với phiên bản mới -> tự tạo Release, app người dùng tự cập nhật
  RELEASE_BRANCHES: "main claude/nifty-feynman-x1nonn"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c 'import muse as z; print(z.__version__)')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} không khớp __version__ = $v"; exit 1
          fi

      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/MuseMailbox.spec --noconfirm --clean

      - name: Smoke test (exe starts)
        shell: pwsh
        run: |
          $env:MUSE_HOME = "$env:RUNNER_TEMP\muse"
          $p = Start-Process -FilePath "dist\MuseMailbox\MuseMailbox.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "MuseMailbox.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\MuseMailbox\* -DestinationPath "dist\MuseMailbox-Portable-${{ steps.ver.outputs.version }}.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: MuseMailbox-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/MuseMailbox-Setup-*.exe
            dist/MuseMailbox-Portable-*.zip

      - name: Decide whether to publish a release
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && " $RELEASE_BRANCHES " == *" ${GITHUB_REF#refs/heads/} "* ]]; then
            # Tự phát hành khi phiên bản trong muse/__init__.py chưa có Release
            if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v$v đã tồn tại, bỏ qua."
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish (v$v)"

      - name: Release notes
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        run: |
          v=${{ steps.ver.outputs.version }}
          awk -v v="$v" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > CHANGELOG_RELEASE.md || true
          [ -s CHANGELOG_RELEASE.md ] || echo "Phiên bản $v" > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Muse Mailbox v${{ steps.ver.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          make_latest: true
          files: |
            dist/MuseMailbox-Setup-*.exe
            dist/MuseMailbox-Portable-*.zip
